name: CI-Checkov

on:
  pull_request:
    branches:
      - develop
      - qa
      - prod
    paths:
      - ".github/workflows/ci-checkov.yml"
      - "iac/**"

permissions:
  contents: read
  id-token: write

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN_CHECKOV: ${{ vars.AWS_ROLE_ARN_CHECKOV }}
      CHECKOV_REPORT_FROM: ${{ vars.CHECKOV_REPORT_FROM }}
      CHECKOV_REPORT_RECIPIENTS: ${{ vars.CHECKOV_REPORT_RECIPIENTS }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Validate report variables
        run: |
          missing=0

          for name in AWS_REGION AWS_ROLE_ARN_CHECKOV CHECKOV_REPORT_FROM CHECKOV_REPORT_RECIPIENTS; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured"
              missing=1
            fi
          done

          exit "$missing"

      - name: Run Checkov
        id: checkov
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$(pwd):/repo" \
            --workdir /repo \
            bridgecrew/checkov:3 \
            --directory /repo/iac \
            -o junitxml \
            --output-file-path /repo/

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkov-junit-report
          path: results_junitxml.xml
          if-no-files-found: ignore

      - name: Render Checkov email
        if: always() && hashFiles('results_junitxml.xml') != ''
        run: |
          node iac/services/checkov-report/render.mjs results_junitxml.xml checkov-report summary

      - name: Configure AWS credentials for email
        if: always() && hashFiles('checkov-report/body.html') != ''
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_CHECKOV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send Checkov email
        if: always() && hashFiles('checkov-report/body.html') != ''
        run: |
          subject="$(cat checkov-report/subject.txt)"
          recipients="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "${CHECKOV_REPORT_RECIPIENTS}")"

          if [ "$(jq 'length' <<< "$recipients")" -eq 0 ]; then
            echo "CHECKOV_REPORT_RECIPIENTS does not contain any recipient"
            exit 1
          fi

          jq -n \
            --arg from "${CHECKOV_REPORT_FROM}" \
            --arg subject "$subject" \
            --argjson recipients "$recipients" \
            --rawfile html checkov-report/body.html \
            --rawfile text checkov-report/body.txt \
            '{
              FromEmailAddress: $from,
              Destination: { ToAddresses: $recipients },
              Content: {
                Simple: {
                  Subject: { Data: $subject, Charset: "UTF-8" },
                  Body: {
                    Html: { Data: $html, Charset: "UTF-8" },
                    Text: { Data: $text, Charset: "UTF-8" }
                  }
                }
              }
            }' > checkov-report/email.json

          aws sesv2 send-email --cli-input-json file://checkov-report/email.json
